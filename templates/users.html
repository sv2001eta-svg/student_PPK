<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список пользователей</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            margin-top: 50px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .user-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .user-card:hover {
            background-color: #f9f9f9;
        }
        .user-info {
            display: flex;
            flex-direction: column;
        }
        .user-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        .user-details {
            font-size: 0.85em;
            color: #777;
        }
        .chat-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
            transition: transform 0.2s;
        }
        .chat-btn:hover {
            transform: scale(1.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 10px;
        }
        .logout-btn {
            color: #ff4b4b;
            text-decoration: none;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Привет, {{ current_user }}! 👋</h2>
            <a href="/logout" class="logout-btn">Выйти</a>
        </div>
        
        <h1>Кому написать?</h1>

        {% if users %}
            {% for user in users %}
            <div class="user-card">
                <div class="user-info">
                    <span class="user-name">{{ user.first_name }} {{ user.last_name }}</span>
                    <span class="user-details">@{{ user.nickname }}</span>
                </div>
                <!-- Ссылка ведет на чат с этим пользователем -->
                <a href="/chat/{{ user.nickname }}" class="chat-btn">Написать </a>
            </div>
            {% endfor %}
        {% else %}
            <p style="text-align: center; color: #777;">Пока нет других пользователей. Зарегистрируйте друга!</p>
        {% endif %}
    </div>

</body>
</html>
