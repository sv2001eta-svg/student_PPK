<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с {{ recipient.nickname }}</title>
    <!-- Уведомления о новых сообщениях -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 500px;
            height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #764ba2;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        .message {
            position: relative;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.mine {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .message.theirs {
            background: white;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message-time {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        #messageInput:focus {
            border-color: #764ba2;
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover:not(:disabled) {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        /* Скроллбар */
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #c1b1d1;
            border-radius: 3px;
        }
        .messages-area::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>Чат с {{ recipient.first_name }} (@{{ recipient.nickname }})</span>
            <a href="/users">← Назад</a>
        </div>

        <!-- Скрытые поля для JavaScript -->
        <input type="hidden" id="recipientId" value="{{ recipient.id }}">
        <input type="hidden" id="currentUserId" value="{{ session['user_id'] }}">

        <div class="messages-area" id="messagesArea">
            {% for msg in messages %}
                <div class="message {% if msg.sender_id == session['user_id'] %}mine{% else %}theirs{% endif %}" 
                     data-id="{{ msg.id }}">
                    {% if msg.sender_id != session['user_id'] %}
                        <strong>{{ msg.sender_nickname }}:</strong><br>
                    {% endif %}
                    {{ msg.message_text }}
                    <div class="message-time">
                        {% if msg.timestamp %}
                            {{ msg.timestamp.strftime('%H:%M') }}
                        {% endif %}
                    </div>
                </div>
            {% endfor %}
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
            <button onclick="sendMessage()" id="sendBtn">Отправить</button>
        </div>
    </div>

    <script>
        // === ИНИЦИАЛИЗАЦИЯ ===
        const currentUserId = parseInt(document.getElementById('currentUserId').value);
        const recipientId = parseInt(document.getElementById('recipientId').value);
        const messagesArea = document.getElementById('messagesArea');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Автопрокрутка при загрузке
        messagesArea.scrollTop = messagesArea.scrollHeight;

        // Отправка по клавише Enter
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // === ОТПРАВКА СООБЩЕНИЯ ===
        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Визуальная блокировка
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            fetch('/api/send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: text, 
                    recipient_id: recipientId 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    input.value = '';
                    pollMessages(); // Сразу проверяем новые сообщения
                } else {
                    alert('Ошибка: ' + (data.message || 'Неизвестная ошибка'));
                }
            })
            .catch(error => {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить сообщение');
            })
            .finally(() => {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
                input.focus();
            });
        }

        // === ДОБАВЛЕНИЕ СООБЩЕНИЯ В ИНТЕРФЕЙС ===
        function appendMessage(msg) {
            const isMine = msg.sender_id == currentUserId;
            const div = document.createElement('div');
            div.className = `message ${isMine ? 'mine' : 'theirs'}`;
            div.dataset.id = msg.id; // Важно для отслеживания новых!
            
            const time = msg.time || new Date().toLocaleTimeString('ru-RU', {
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            div.innerHTML = `
                ${!isMine ? `<strong>${escapeHtml(msg.sender_nickname)}:</strong><br>` : ''}
                ${escapeHtml(msg.message_text)}
                <div class="message-time">${time}</div>
            `;
            messagesArea.appendChild(div);
        }

        // === REAL-TIME ПРОВЕРКА НОВЫХ СООБЩЕНИЙ (JSON API) ===
        function pollMessages() {
            // Получаем ID последнего отображённого сообщения
            const lastMsg = messagesArea.querySelector('.message:last-child');
            const lastId = lastMsg ? parseInt(lastMsg.dataset.id) || 0 : 0;

            fetch(`/api/get_messages?recipient_id=${recipientId}&last_id=${lastId}`)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        data.forEach(msg => appendMessage(msg));
                        scrollToBottom();
                    }
                })
                .catch(error => {
                    console.error('Ошибка синхронизации:', error);
                });
        }

        // Плавная прокрутка вниз
        function scrollToBottom() {
            messagesArea.scrollTo({ 
                top: messagesArea.scrollHeight, 
                behavior: 'smooth' 
            });
        }

        // Защита от XSS-атак
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Запускаем проверку новых сообщений каждые 2 секунды
        setInterval(pollMessages, 2000);
    </script>
</body>
</html>
