<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с {{ recipient.nickname }}</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 500px;
            height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #764ba2;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .message {
            position: relative;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.mine {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .message.theirs {
            background: white;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message-time {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        .message.mine {
            background: #764ba2;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }
        .message.theirs {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        button {
            margin-left: 10px;
            padding: 10px 20px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>Чат с {{ recipient.first_name }} ({{ recipient.nickname }})</span>
            <a href="/users">← Назад</a>
        </div>

        <!-- Добавь эту строку перед сообщениями -->
        <input type="hidden" id="recipientId" value="{{ recipient.id }}">
        <div class="messages-area" id="messagesArea">
            {% for msg in messages %}
                {% if msg.sender_id == session['user_id'] %}
                    <div class="message mine">
                        {{ msg.message_text }}
                    </div>
                {% else %}
                    <div class="message theirs">
                        <strong>{{ msg.sender_nickname }}:</strong><br>
                        {{ msg.message_text }}
                    </div>
                {% endif %}
            {% endfor %}
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Введите сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // Автопрокрутка вниз при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.scrollTop = messagesArea.scrollHeight;
        });

        // Отправка сообщения по Enter
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const recipientId = document.getElementById('recipientId').value;

            if (!text) return;

            // Блокируем кнопку отправки
            const sendBtn = document.querySelector('button[onclick="sendMessage()"]');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Отправка...';

            // Отправляем на сервер
            fetch('/api/send_message', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    message: text, 
                    recipient_id: parseInt(recipientId) 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Очищаем поле
                    input.value = '';
                    // Добавляем сообщение визуально
                    addMessageToChat(text, 'mine');
                    // Прокручиваем вниз
                    scrollToBottom();
                } else {
                    alert('Ошибка: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить сообщение');
            })
            .finally(() => {
                // Разблокируем кнопку
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
                input.focus();
            });
        }

        // Добавление сообщения в чат
        function addMessageToChat(text, type) {
            const messagesArea = document.getElementById('messagesArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            if (type === 'mine') {
                messageDiv.innerHTML = `
                    ${escapeHtml(text)}
                    <div class="message-time">${timeString}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <strong>${senderNickname}:</strong><br>
                    ${escapeHtml(text)}
                    <div class="message-time">${timeString}</div>
                `;
            }
            
            messagesArea.appendChild(messageDiv);
        }

        // Прокрутка вниз
        function scrollToBottom() {
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.scrollTo({
                top: messagesArea.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Защита от XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Автоматическая проверка новых сообщений каждые 3 секунды
        let lastMessageCount = document.querySelectorAll('.message').length;
        
        function checkNewMessages() {
            fetch(window.location.href + '?ajax=1', {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newMessagesArea = doc.querySelector('#messagesArea');
                const currentMessagesArea = document.getElementById('messagesArea');
                
                if (newMessagesArea && newMessagesArea.children.length > currentMessagesArea.children.length) {
                    // Есть новые сообщения - обновляем
                    currentMessagesArea.innerHTML = newMessagesArea.innerHTML;
                    scrollToBottom();
                }
            })
            .catch(error => console.error('Ошибка проверки сообщений:', error));
        }

        // Запускаем проверку каждые 3 секунды
        setInterval(checkNewMessages, 3000);
    </script>
